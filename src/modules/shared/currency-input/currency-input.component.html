<div class="flex flex-col gap-1.5 w-full">
  <!-- Label -->
  @if (label()) {
      <label [ngClass]="isDisabled() ? 'text-slate-400' : 'text-slate-600'" class="text-[11px] font-black tracking-widest uppercase select-none flex items-center ml-0.5">
          {{ label() }}
          @if (required()) {
              <span class="text-rose-500 ml-1 text-[13px] font-black leading-none">*</span>
          }
      </label>
  }

  <!-- Input Wrapper -->
  <div class="relative flex items-center w-full group">
      <!-- Currency Prefix -->
      <span
          [ngClass]="isDisabled() ? 'text-slate-400' : 'text-slate-400 group-focus-within:text-blue-500'"
          class="absolute text-xs left-3 font-semibold select-none pointer-events-none transition-colors duration-300"
      >
          {{ currency() }}
      </span>

      <!-- Input -->
      <input
          #inputElement
          type="text"
          [value]="displayValue()"
          [placeholder]="placeholder()"
          [disabled]="isDisabled()"
          (input)="onInput($event)"
          (blur)="onBlur($event)"
          class="w-full bg-white border text-slate-800 transition-all duration-300 focus:outline-none focus:ring-4 placeholder:text-slate-400/70 shadow-sm h-11 text-sm px-3.5 rounded-xl border-slate-200 focus:border-blue-500 focus:ring-blue-500/20 hover:border-slate-300 pl-12 disabled:bg-slate-50 disabled:text-slate-500 disabled:border-slate-200 disabled:cursor-not-allowed disabled:shadow-none font-medium"
      />
  </div>
</div>
