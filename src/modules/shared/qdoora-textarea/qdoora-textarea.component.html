<div class="flex flex-col gap-1.5 w-full">
  <!-- Title / Label -->
  <div class="flex flex-col">
    <label [ngClass]="isDisabled() ? 'text-slate-400' : 'text-slate-600'" class="text-[11px] font-black tracking-widest uppercase select-none flex items-center ml-0.5">
      {{ title() }}
      @if (required()) {
        <span class="text-rose-500 ml-1 text-[13px] font-black leading-none">*</span>
      }
    </label>
    @if (description()) {
      <span class="text-xs text-slate-500 ml-0.5 mt-0.5">{{ description() }}</span>
    }
  </div>

  <!-- Textarea Wrapper -->
  <div class="relative flex flex-col w-full bg-white border rounded-xl transition-all duration-300 shadow-sm overflow-hidden"
    [ngClass]="{
      'border-slate-200 focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/20 hover:border-slate-300': !isDisabled(),
      'bg-slate-50 border-slate-200 cursor-not-allowed shadow-none': isDisabled()
    }">
    
    <textarea
      #textareaElement
      [rows]="rows()"
      [maxLength]="maxLength()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="w-full px-3.5 py-3 bg-transparent text-slate-800 text-sm font-medium focus:outline-none placeholder:text-slate-400/70 disabled:text-slate-500 disabled:cursor-not-allowed resize-y min-h-[80px]"
    ></textarea>
    
    <!-- Character Counter -->
    <div class="flex justify-end px-3 py-1.5 bg-slate-50/50 border-t border-slate-100">
      <span class="text-[10px] font-medium" 
        [ngClass]="currentValue().length >= maxLength() ? 'text-rose-500' : 'text-slate-400'">
        {{ currentValue().length }} / {{ maxLength() }}
      </span>
    </div>
  </div>
</div>
