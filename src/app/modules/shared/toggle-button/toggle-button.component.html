<div [formGroup]="form" [ngClass]="[classes, form.get(controlName)?.disabled ? 'opacity-50 pointer-events-none' : '']">
    <div
        class="flex-auto cursor-pointer"
        (click)="onToggleClick()"
    >
        <div class="flex flex-row items-center font-medium leading-6">
            <!-- Icono -->
            <mat-icon
                *ngIf="useIcon"
                [svgIcon]="icon"
                class="mr-2 icon-size-4"
            ></mat-icon>

            <!-- Titulo -->
            {{ title }}
        </div>

        <!-- Descripcion -->
        <div class="text-secondary text-md" *ngIf="useDescription">
            {{ description }}
        </div>
    </div>
    
    <div class="flex items-center">
        <button type="button" 
            class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary-600 focus:ring-offset-2 ml-4"
            [ngClass]="form.get(controlName)?.disabled ? 'bg-gray-300' : (form.get(controlName)?.value ? 'bg-primary-600' : 'bg-gray-200')"
            (click)="onToggleClick()">
            <span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"
                [ngClass]="form.get(controlName)?.value ? 'translate-x-5' : 'translate-x-0'"></span>
        </button>

        <span 
            *ngIf="active_label && inactive_label"
            class="text-sm font-medium ml-2">
            {{ form.get(controlName)?.value ? active_label : inactive_label }}
        </span>
    </div>
</div>
