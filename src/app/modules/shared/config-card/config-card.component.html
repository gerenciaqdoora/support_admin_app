<div class="rounded-2xl border border-gray-200 bg-white shadow-sm overflow-hidden transition-all duration-300 mt-2">

    <!-- HEADER -->
    <div
        class="flex items-center justify-between px-4 py-2 cursor-pointer select-none"
        (click)="toggleOpen()"
    >
        <!-- Left -->
        <div class="flex flex-col gap-1">
            <span class="text-base font-semibold text-gray-800">
                {{ title }}
            </span>

            <!-- Resumen solo cuando está cerrado -->
            <span
                *ngIf="!isOpen && summary"
                class="text-sm text-gray-500"
            >
                <div class="flex flex-wrap gap-2 mt-2">
                    <span
                        *ngFor="let item of summary.split(' · ')"
                        class="text-xs bg-primary-100 text-gray-600 px-2 py-1 rounded-full"
                    >
                        {{ item }}
                    </span>
                </div>
            </span>
        </div>

        <!-- Right -->
        <div class="flex items-center gap-4">

            <!-- Toggle heredar -->
            <div
                *ngIf="showInheritToggle"
                class="flex items-center gap-2"
                (click)="$event.stopPropagation()"
            >
                <span
                    class="text-sm text-gray-600"
                    [matTooltip]="'Esto permite heredar la configuración a todas las subcuentas asociadas.'"
                    matTooltipShowDelay="300"
                    matTooltipHideDelay="100"
                >
                    Heredar
                </span>

                <!-- Toggle moderno -->
                <button
                    type="button"
                    [disabled]="inheritDisabled"
                    (click)="onToggleInherit()"
                    class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors duration-300 focus:outline-none"
                    [ngClass]="{
                        'bg-indigo-600': inheritValue,
                        'bg-gray-300': !inheritValue,
                        'opacity-50 cursor-not-allowed': inheritDisabled
                    }"
                >
                    <span
                        class="inline-block h-5 w-5 transform rounded-full bg-white shadow-md transition-transform duration-300"
                        [ngClass]="{
                            'translate-x-5': inheritValue,
                            'translate-x-1': !inheritValue
                        }"
                    ></span>
                </button>
            </div>

            <!-- Chevron -->
            <svg
                class="w-5 h-5 text-gray-500 transform transition-transform duration-300"
                [ngClass]="{ 'rotate-180': isOpen }"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
            >
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>

        </div>
    </div>

    <!-- BODY -->
    <div
        class="grid transition-all duration-300 ease-in-out"
        [ngClass]="{
            'grid-rows-[1fr] opacity-100': isOpen,
            'grid-rows-[0fr] opacity-0': !isOpen
        }"
    >
        <div class="overflow-hidden">
            <div class="px-5 pb-5 pt-2 border-t border-gray-100">
                <ng-content></ng-content>
            </div>
        </div>
    </div>
</div>
